[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheros"
version = "0.1.0"
description = "AetherOS foundation package for the AI agent runtime platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "dependency-injector>=4.44,<5.0",
  "httpx>=0.28,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "pgvector>=0.3,<1.0",
  "alembic>=1.14,<2.0",
  "redis[hiredis]>=5.2,<6.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langfuse>=2.55,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<25.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
  "hypothesis>=6.119,<7.0",
  "fakeredis>=2.26,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aetheros*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
  "integration: marks tests requiring PostgreSQL or Redis (deselect with '-m \"not integration\"')",
]

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "pgvector.*", "fakeredis.*"]
ignore_missing_imports = true
